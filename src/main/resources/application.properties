spring.application.name=spring-boot-backend-chat
server.port=${PORT:8080}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/springboot_chat}

chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:4200}
chat.history-size=${CHAT_HISTORY_SIZE:10}

management.endpoints.web.exposure.include=health
